# ¿Qué? Formulario de issue para una tarea que implementa un requisito documentado.
# ¿Para qué? Que cada rama y cada pull request nazcan de un RF o una HU, no de una ocurrencia.
# ¿Impacto? Sin esta trazabilidad no se puede demostrar qué requisito cubre cada cambio.

name: "📋 Tarea (HU/RF)"
description: Trabajo planificado que implementa o modifica un requisito documentado.
title: "[Tarea] "
labels: ["type:feat"]

body:
  - type: markdown
    attributes:
      value: |
        Una tarea = una rama = un pull request. Si no cabe en un PR revisable, divídela.

  - type: input
    id: requisito
    attributes:
      label: Requisito de referencia
      description: RF o HU que cubre esta tarea (ver `docs/requisitos/`).
      placeholder: "RF-027 — docs/requisitos/RFs/RF-027_participar_en_votaciones.md"
    validations:
      required: true

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qué debe existir cuando esta tarea esté cerrada. Una o dos frases.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Área afectada
      multiple: true
      options:
        - Backend (be/)
        - Frontend (fe/)
        - Base de datos / migración Alembic
        - Documentación (docs/)
        - Configuración / infraestructura
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Condiciones verificables. Si no se puede comprobar, no es un criterio.
      value: |
        - [ ]
        - [ ]
        - [ ] Las pruebas que cubren el cambio pasan en verde
    validations:
      required: true

  - type: textarea
    id: notas
    attributes:
      label: Notas técnicas (opcional)
      description: Archivos que crees que hay que tocar, dudas abiertas, decisiones pendientes.
